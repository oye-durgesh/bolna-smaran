<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400;8..60,500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  body { margin:0; background:#1A1410; font-family:'Inter',system-ui,sans-serif; color:#2E241B; display:flex; align-items:center; justify-content:center; min-height:100vh; }
  .serif { font-family:'Source Serif 4',Georgia,serif; letter-spacing:-0.01em; }
  .phone { width:390px; height:844px; border-radius:44px; background:#F5EFE6; position:relative; overflow:hidden; box-shadow:0 0 0 10px #1A1410,0 0 0 12px #2E241B,0 30px 60px rgba(46,36,27,0.18); }
  .statusbar { position:absolute; top:0; left:0; right:0; height:47px; padding:0 30px; display:flex; align-items:flex-end; justify-content:space-between; padding-bottom:8px; font-size:15px; font-weight:600; z-index:5; }
  .home-indicator { position:absolute; bottom:8px; left:50%; transform:translateX(-50%); width:134px; height:5px; border-radius:3px; opacity:0.9; }
  .screen-body { position:absolute; top:47px; left:0; right:0; bottom:0; }
  @keyframes s-fade { from { opacity:0 } to { opacity:1 } }
  @keyframes s-fadeup { from { opacity:0; transform:translateY(8px) } to { opacity:1; transform:translateY(0) } }
  @keyframes s-scale { 0% { opacity:0; transform:scale(0.8) } 65% { transform:scale(1.06) } 100% { opacity:1; transform:scale(1) } }
  @keyframes s-draw360 { from { stroke-dashoffset:var(--dash) } to { stroke-dashoffset:0 } }
  @keyframes s-pulse { 0% { transform:scale(0.6); opacity:0.45 } 100% { transform:scale(2.1); opacity:0 } }
  @keyframes s-settle { 0% { transform:scale(1) } 40% { transform:scale(1.025) } 100% { transform:scale(1) } }
  .anim-fade { opacity:0; animation:s-fade 400ms ease-out forwards; }
  .anim-fadeup { opacity:0; transform:translateY(8px); animation:s-fadeup 350ms ease-out forwards; }
  .anim-scale { opacity:0; animation:s-scale 500ms cubic-bezier(0.34,1.4,0.55,1) forwards; }
</style>
</head>
<body>
<title>Samran — B2 Audio · Playing</title>
<div class="phone" data-screen-label="B2 Audio playing">
        <div class="statusbar"><span>9:41</span><span style="width:17px; height:11px; border:1px solid #2E241B; border-radius:2px;"></span></div>
        <div class="screen-body">
          <div style="position:absolute; inset:0; background: radial-gradient(ellipse 90% 60% at 50% 20%, rgba(212,165,124,0.5) 0%, rgba(196,184,206,0.35) 40%, rgba(245,239,230,0) 75%);"></div>
          <div style="position:relative; height:100%; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:24px 24px 100px; box-sizing:border-box;">
            <div style="flex:1;"></div>
            <div style="width:88px; height:88px; position:relative; display:flex; align-items:center; justify-content:center;">
              <div style="position:absolute; width:130px; height:130px; border-radius:50%; background:radial-gradient(circle, rgba(122,155,107,0.2) 0%, rgba(122,155,107,0) 70%); top:-21px; left:-21px;"></div>
              <svg width="88" height="88" viewBox="0 0 88 88"><circle cx="44" cy="44" r="38" fill="none" stroke="#7A9B6B" stroke-width="2.5"/><path d="M30 46 L40 56 L60 36" fill="none" stroke="#7A9B6B" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
            </div>
            <div class="serif" style="font-size:22px; color:#2E241B; margin-top:24px; text-align:center;">You're all set, Ramesh.</div>
            <div style="font-size:14px; color:#7A6B5D; margin-top:12px; text-align:center; max-width:280px; line-height:1.5;">Sathi will call you at 8:00 AM for your Metformin.</div>
            <div style="display:flex; flex-direction:column; align-items:center; gap:6px; margin-top:24px;">
              <div style="display:flex; align-items:center; gap:8px;">
                <div style="width:22px; height:22px; border-radius:50%; background:#7B8B5A; display:flex; align-items:center; justify-content:center;">
                  <svg width="8" height="10" viewBox="0 0 8 10" fill="none"><rect x="0" y="0" width="2.5" height="10" rx="1" fill="#FFFFFF"/><rect x="5.5" y="0" width="2.5" height="10" rx="1" fill="#FFFFFF"/></svg>
                </div>
                <span style="font-size:14px; color:#8A7F6A; font-style:italic;">Playing…</span>
              </div>
              <div style="width:140px; height:2px; background:#D9D2C3; border-radius:1px; overflow:hidden; margin-top:4px;">
                <div style="width:55%; height:100%; background:#6B7A4F; border-radius:1px;"></div>
              </div>
            </div>
            <div style="flex:1;"></div>
            <div style="width:100%; height:56px; background:#2E241B; border-radius:999px; display:flex; align-items:center; justify-content:center; color:#F5EFE6; font-size:16px; font-weight:500; box-shadow:0 4px 12px rgba(46,36,27,0.12);">Go to Home</div>
          </div>
          <div style="position:absolute; bottom:56px; left:24px; right:24px; display:flex; align-items:center; gap:6px;">
            <div style="width:8px; height:8px; border-radius:50%; background:#6B7A4F;"></div>
            <span style="font-size:12px; color:#6B7A4F;">Playing — filled pause badge, progress bar, italic label</span>
          </div>
        </div>
        <div class="home-indicator"></div>
      </div>
</body>
</html>
