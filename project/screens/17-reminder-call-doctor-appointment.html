<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400;8..60,500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  body { margin:0; background:#1A1410; font-family:'Inter',system-ui,sans-serif; color:#2E241B; display:flex; align-items:center; justify-content:center; min-height:100vh; }
  .serif { font-family:'Source Serif 4',Georgia,serif; letter-spacing:-0.01em; }
  .phone { width:390px; height:844px; border-radius:44px; background:#F5EFE6; position:relative; overflow:hidden; box-shadow:0 0 0 10px #1A1410,0 0 0 12px #2E241B,0 30px 60px rgba(46,36,27,0.18); }
  .statusbar { position:absolute; top:0; left:0; right:0; height:47px; padding:0 30px; display:flex; align-items:flex-end; justify-content:space-between; padding-bottom:8px; font-size:15px; font-weight:600; z-index:5; }
  .home-indicator { position:absolute; bottom:8px; left:50%; transform:translateX(-50%); width:134px; height:5px; border-radius:3px; opacity:0.9; }
  .screen-body { position:absolute; top:47px; left:0; right:0; bottom:0; }
  @keyframes s-fade { from { opacity:0 } to { opacity:1 } }
  @keyframes s-fadeup { from { opacity:0; transform:translateY(8px) } to { opacity:1; transform:translateY(0) } }
  @keyframes s-scale { 0% { opacity:0; transform:scale(0.8) } 65% { transform:scale(1.06) } 100% { opacity:1; transform:scale(1) } }
  @keyframes s-draw360 { from { stroke-dashoffset:var(--dash) } to { stroke-dashoffset:0 } }
  @keyframes s-pulse { 0% { transform:scale(0.6); opacity:0.45 } 100% { transform:scale(2.1); opacity:0 } }
  @keyframes s-settle { 0% { transform:scale(1) } 40% { transform:scale(1.025) } 100% { transform:scale(1) } }
  .anim-fade { opacity:0; animation:s-fade 400ms ease-out forwards; }
  .anim-fadeup { opacity:0; transform:translateY(8px); animation:s-fadeup 350ms ease-out forwards; }
  .anim-scale { opacity:0; animation:s-scale 500ms cubic-bezier(0.34,1.4,0.55,1) forwards; }
</style>
</head>
<body>
<title>Samran — 17 Reminder call · Doctor appointment</title>
<div class="phone" data-screen-label="17 Call doctor appointment">
        <div class="statusbar" style="color:#F5EFE6;"><span>9:41</span><span style="width:17px; height:11px; border:1px solid #F5EFE6; border-radius:2px;"></span></div>
        <div class="screen-body" style="height:calc(100% - 47px);">
          <div style="position:absolute; inset:0; background: radial-gradient(ellipse 100% 60% at 50% 20%, #B87D5A 0%, #7A6B7E 45%, #2A2530 85%);"></div>
          <div style="position:relative; padding:40px 24px 40px; box-sizing:border-box; height:100%; display:flex; flex-direction:column; align-items:center; justify-content:space-between;">
            <div style="display:flex; flex-direction:column; align-items:center; margin-top:40px;">
              <div style="width:96px; height:96px; border-radius:50%; background:linear-gradient(135deg,#E8DFD1,#B87D5A); display:flex; align-items:center; justify-content:center;">
                <svg width="44" height="44" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="1.5"><path d="M4 12h2M8 8v8M12 5v14M16 8v8M20 12h-2"/></svg>
              </div>
              <div class="serif" style="font-size:28px; color:#FFFFFF; margin-top:20px;">Sathi</div>
              <div style="font-size:16px; color:rgba(245,239,230,0.9); margin-top:6px;">Doctor appointment tomorrow</div>
              <div style="font-size:13px; color:rgba(245,239,230,0.7); margin-top:8px;">Ringing…</div>
            </div>
            <div style="display:flex; flex-direction:column; align-items:center; gap:24px;">
              <div style="display:flex; gap:80px;">
                <div style="display:flex; flex-direction:column; align-items:center; gap:10px;">
                  <div style="width:72px; height:72px; border-radius:50%; background:#C08560; display:flex; align-items:center; justify-content:center;"><svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="1.5" transform="rotate(135)"><path d="M5 4h4l2 5-2.5 1.5a11 11 0 005 5L15 13l5 2v4a2 2 0 01-2 2A16 16 0 013 6a2 2 0 012-2z"/></svg></div>
                  <div style="font-size:13px; color:#FFFFFF;">Not now</div>
                </div>
                <div style="display:flex; flex-direction:column; align-items:center; gap:10px;">
                  <div style="width:72px; height:72px; border-radius:50%; background:#7A9B6B; display:flex; align-items:center; justify-content:center;"><svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="1.5"><rect x="9" y="3" width="6" height="12" rx="3"/><path d="M5 11a7 7 0 0014 0M12 18v3"/></svg></div>
                  <div style="font-size:13px; color:#FFFFFF;">Answer</div>
                </div>
              </div>
              <div style="font-size:14px; color:rgba(245,239,230,0.8);">Remind me in 15 minutes</div>
            </div>
          </div>
        </div>
        <div class="home-indicator" style="background:#F5EFE6; opacity:0.7;"></div>
      </div>
</body>
</html>
