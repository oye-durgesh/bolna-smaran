<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400;8..60,500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  body { margin:0; background:#1A1410; font-family:'Inter',system-ui,sans-serif; color:#2E241B; display:flex; align-items:center; justify-content:center; min-height:100vh; }
  .serif { font-family:'Source Serif 4',Georgia,serif; letter-spacing:-0.01em; }
  .phone { width:390px; height:844px; border-radius:44px; background:#F5EFE6; position:relative; overflow:hidden; box-shadow:0 0 0 10px #1A1410,0 0 0 12px #2E241B,0 30px 60px rgba(46,36,27,0.18); }
  .statusbar { position:absolute; top:0; left:0; right:0; height:47px; padding:0 30px; display:flex; align-items:flex-end; justify-content:space-between; padding-bottom:8px; font-size:15px; font-weight:600; z-index:5; }
  .home-indicator { position:absolute; bottom:8px; left:50%; transform:translateX(-50%); width:134px; height:5px; border-radius:3px; opacity:0.9; }
  .screen-body { position:absolute; top:47px; left:0; right:0; bottom:0; }
  @keyframes s-fade { from { opacity:0 } to { opacity:1 } }
  @keyframes s-fadeup { from { opacity:0; transform:translateY(8px) } to { opacity:1; transform:translateY(0) } }
  @keyframes s-scale { 0% { opacity:0; transform:scale(0.8) } 65% { transform:scale(1.06) } 100% { opacity:1; transform:scale(1) } }
  @keyframes s-draw360 { from { stroke-dashoffset:var(--dash) } to { stroke-dashoffset:0 } }
  @keyframes s-pulse { 0% { transform:scale(0.6); opacity:0.45 } 100% { transform:scale(2.1); opacity:0 } }
  @keyframes s-settle { 0% { transform:scale(1) } 40% { transform:scale(1.025) } 100% { transform:scale(1) } }
  .anim-fade { opacity:0; animation:s-fade 400ms ease-out forwards; }
  .anim-fadeup { opacity:0; transform:translateY(8px); animation:s-fadeup 350ms ease-out forwards; }
  .anim-scale { opacity:0; animation:s-scale 500ms cubic-bezier(0.34,1.4,0.55,1) forwards; }
</style>
</head>
<body>
<title>Samran — 11 Medicine detail</title>
<div class="phone" data-screen-label="11 Medicine detail">
        <div class="statusbar"><span>9:41</span><span style="width:17px; height:11px; border:1px solid #2E241B; border-radius:2px;"></span></div>
        <div class="screen-body" style="background:rgba(46,36,27,0.35);">
          <div style="position:absolute; top:0; left:0; right:0; height:120px; background:#F5EFE6; opacity:0.55; padding:24px; box-sizing:border-box;">
            <div class="serif" style="font-size:22px; color:#2E241B; opacity:0.9;">Good morning, Ramesh</div>
          </div>
          <div style="position:absolute; bottom:0; left:0; right:0; background:#F5EFE6; border-radius:24px 24px 0 0; padding:12px 24px 100px; box-sizing:border-box; height:75%;">
            <div style="width:36px; height:4px; background:#E8DFD1; border-radius:2px; margin:0 auto 20px;"></div>
            <div style="display:flex; gap:14px; align-items:center;">
              <div style="width:56px; height:56px; border-radius:50%; background:linear-gradient(135deg,#D4A57C,#B87D5A); display:flex; align-items:center; justify-content:center;"><svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="1.5"><rect x="3" y="8" width="18" height="8" rx="4" transform="rotate(-30 12 12)"/></svg></div>
              <div><div class="serif" style="font-size:22px; color:#2E241B;">Metformin</div><div style="font-size:14px; color:#7A6B5D;">For Diabetes</div></div>
            </div>
            <div style="height:1px; background:#E8DFD1; margin:20px 0;"></div>
            <div style="display:flex; flex-direction:column; gap:12px;">
              <div style="display:flex; justify-content:space-between; padding:8px 0; border-bottom:1px solid #F0EBE0;"><span style="font-size:14px; color:#7A6B5D;">Time</span><span style="font-size:15px; color:#2E241B; font-weight:500;">8:00 AM, 2:00 PM</span></div>
              <div style="display:flex; justify-content:space-between; padding:8px 0; border-bottom:1px solid #F0EBE0;"><span style="font-size:14px; color:#7A6B5D;">Frequency</span><span style="font-size:15px; color:#2E241B; font-weight:500;">2 times daily</span></div>
              <div style="display:flex; justify-content:space-between; padding:8px 0; border-bottom:1px solid #F0EBE0;"><span style="font-size:14px; color:#7A6B5D;">Duration</span><span style="font-size:15px; color:#2E241B; font-weight:500;">Ongoing</span></div>
              <div style="display:flex; justify-content:space-between; padding:8px 0;"><span style="font-size:14px; color:#7A6B5D;">Started</span><span style="font-size:15px; color:#2E241B; font-weight:500;">12 Aug 2026</span></div>
            </div>
            <div style="display:flex; flex-direction:column; gap:12px; margin-top:28px;">
              <div style="height:52px; background:#FFFFFF; border:1px solid #E8DFD1; border-radius:999px; display:flex; align-items:center; justify-content:center; font-size:15px; color:#2E241B; font-weight:500;">Edit</div>
              <div style="height:52px; background:#FFFFFF; border:1px solid #E8C4B5; border-radius:999px; display:flex; align-items:center; justify-content:center; font-size:15px; color:#C08560; font-weight:500;">Remove medicine</div>
            </div>
          </div>
          <div class="home-indicator"></div>
        </div>
      </div>
</body>
</html>
