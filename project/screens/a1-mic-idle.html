<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400;8..60,500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  body { margin:0; background:#1A1410; font-family:'Inter',system-ui,sans-serif; color:#2E241B; display:flex; align-items:center; justify-content:center; min-height:100vh; }
  .serif { font-family:'Source Serif 4',Georgia,serif; letter-spacing:-0.01em; }
  .phone { width:390px; height:844px; border-radius:44px; background:#F5EFE6; position:relative; overflow:hidden; box-shadow:0 0 0 10px #1A1410,0 0 0 12px #2E241B,0 30px 60px rgba(46,36,27,0.18); }
  .statusbar { position:absolute; top:0; left:0; right:0; height:47px; padding:0 30px; display:flex; align-items:flex-end; justify-content:space-between; padding-bottom:8px; font-size:15px; font-weight:600; z-index:5; }
  .home-indicator { position:absolute; bottom:8px; left:50%; transform:translateX(-50%); width:134px; height:5px; border-radius:3px; opacity:0.9; }
  .screen-body { position:absolute; top:47px; left:0; right:0; bottom:0; }
  @keyframes s-fade { from { opacity:0 } to { opacity:1 } }
  @keyframes s-fadeup { from { opacity:0; transform:translateY(8px) } to { opacity:1; transform:translateY(0) } }
  @keyframes s-scale { 0% { opacity:0; transform:scale(0.8) } 65% { transform:scale(1.06) } 100% { opacity:1; transform:scale(1) } }
  @keyframes s-draw360 { from { stroke-dashoffset:var(--dash) } to { stroke-dashoffset:0 } }
  @keyframes s-pulse { 0% { transform:scale(0.6); opacity:0.45 } 100% { transform:scale(2.1); opacity:0 } }
  @keyframes s-settle { 0% { transform:scale(1) } 40% { transform:scale(1.025) } 100% { transform:scale(1) } }
  .anim-fade { opacity:0; animation:s-fade 400ms ease-out forwards; }
  .anim-fadeup { opacity:0; transform:translateY(8px); animation:s-fadeup 350ms ease-out forwards; }
  .anim-scale { opacity:0; animation:s-scale 500ms cubic-bezier(0.34,1.4,0.55,1) forwards; }
</style>
</head>
<body>
<title>Samran — A1 Mic · Idle</title>
<div class="phone" data-screen-label="A1 Mic idle">
        <div class="statusbar"><span>9:41</span><span style="width:17px; height:11px; border:1px solid #2B2318; border-radius:2px;"></span></div>
        <div class="screen-body" style="background:#F0EAE0; padding:20px 24px; box-sizing:border-box;">
          <div style="display:flex; align-items:center; justify-content:space-between;">
            <div style="width:44px; height:44px; border-radius:50%; background:#F8F4EC; border:1px solid #D9D2C3; display:flex; align-items:center; justify-content:center;">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#2B2318" stroke-width="1.5"><path d="M15 6l-6 6 6 6"/></svg>
            </div>
            <div style="width:40px; height:40px; position:relative;">
              <svg width="40" height="40" viewBox="0 0 40 40"><circle cx="20" cy="20" r="17" fill="none" stroke="#D9D2C3" stroke-width="3"/><circle cx="20" cy="20" r="17" fill="none" stroke="#6B7A4F" stroke-width="3" stroke-linecap="round" stroke-dasharray="35.6 106.8" transform="rotate(-90 20 20)"/></svg>
              <div style="position:absolute; inset:0; display:flex; align-items:center; justify-content:center; font-size:12px; color:#2B2318; font-weight:500;">1/3</div>
            </div>
          </div>
          <div class="serif" style="font-size:24px; color:#2B2318; margin-top:20px;">Let's get started.</div>
          <div style="font-size:14px; color:#8A7F6A; margin-top:6px;">Tell Sathi a little about you and your medicine.</div>
          <div style="font-size:11px; color:#8A7F6A; letter-spacing:0.1em; margin-top:28px;">YOUR NAME</div>
          <div style="margin-top:10px; height:56px; background:#F8F4EC; border:1px solid #D9D2C3; border-radius:12px; display:flex; align-items:center; padding:0 16px; gap:12px;">
            <span style="flex:1; font-size:17px; color:#2B2318;">Ramesh</span>
            <div style="width:32px; height:32px; border-radius:50%; display:flex; align-items:center; justify-content:center;">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#8A7F6A" stroke-width="1.5"><rect x="9" y="3" width="6" height="12" rx="3"/><path d="M5 11a7 7 0 0014 0M12 18v3"/></svg>
            </div>
          </div>
          <div style="font-size:13px; color:#8A7F6A; margin-top:8px;">Sathi will use this to greet you.</div>
          <div style="position:absolute; bottom:120px; left:24px; right:24px; display:flex; align-items:center; gap:6px;">
            <div style="width:8px; height:8px; border-radius:50%; background:#8A7F6A;"></div>
            <span style="font-size:12px; color:#8A7F6A;">Idle — mic outline, ready to tap</span>
          </div>
        </div>
        <div class="home-indicator"></div>
      </div>
</body>
</html>
